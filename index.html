<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>ChronoFlip</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="A modern flip clock timer with theme support">
  <meta name="author" content="Aneeth Kumaar">
  <meta name="theme-color" content="#1e2327">
  <link rel="icon" type="image/png" href="assets/images/favicon2.png">
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/flipclock.css">
  <link rel="stylesheet" href="css/style.css">

  <script defer src="js/jquery.min.js"></script>
  <script defer src="js/flipclock.min.js"></script>
  <script defer src="js/script.js"></script>
</head>

<body>
  <div class="theme-toggle">
    <input type="checkbox" id="theme-switch" aria-label="Toggle dark theme">
    <label for="theme-switch">
      <span class="toggle-track"></span>
    </label>
  </div>

  <div class="timer-complete-overlay" role="alertdialog" aria-label="Timer finished">
    <div class="message">Time's Up!</div>
  </div>

  <div class="clock-container">
    <div class="js-flipclock"></div>
  </div>

  <div class="preset-times">
    <button class="preset-btn" data-seconds="5">5s</button>
    <button class="preset-btn" data-seconds="30">30s</button>
    <button class="preset-btn" data-seconds="60">1m</button>
    <button class="preset-btn" data-seconds="120">2m</button>
    <button class="preset-btn" data-seconds="300">5m</button>
    <button class="preset-btn" data-seconds="600">10m</button>
    <button class="preset-btn" data-seconds="900">15m</button>
    <button class="preset-btn" data-seconds="1800">30m</button>
    <button class="preset-btn" data-seconds="3600">1h</button>
    <button class="preset-btn" data-seconds="7200">2h</button>
    <button class="preset-btn" id="current-time-btn">Current Time</button>
  </div>

  <div class="copyright">
    Made by Aneeth Kumaar with &#x2764; •
    <a href="https://github.com/AKwasTaken/ChronoFlip" target="_blank" rel="noopener noreferrer">GitHub</a>
  </div>

  <noscript><p style="position:fixed;top:45%;width:100%;text-align:center">ChronoFlip needs JavaScript.</p></noscript>
</body>
</html>
